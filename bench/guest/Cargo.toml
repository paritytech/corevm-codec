[package]
name = "corevm-codec-bench-guest"
version = "0.1.0"
edition = "2024"
publish = false
description = "CoreVM codec benchmark program for PolkaVM"

[dependencies]
corevm-codec-bench = { path = "..", default-features = false }
picoalloc = "5.2.1"
polkavm-derive = "0.37.0"

[profile.release]
lto = true
panic = "abort"
opt-level = 3
codegen-units = 1

