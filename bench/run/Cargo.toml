jam-codec = { workspace = true }
jam-pvm-common = { version = "0.1.26", default-features = false, features = [] }
jam-types = "0.1.26"
log = { workspace = true }
polkavm = { version = "0.29.0", features = ["std"] }

[lints]
workspace = true
