---
name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Install dependencies
        run: |
          sudo -n apt-get -qq update
          sudo -n apt-get -qq install -y nasm
      - name: Run tests
        run: ./ci/test.sh
  bench:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Run benchmarks (CoreVM)
        run: ./ci/bench.sh
