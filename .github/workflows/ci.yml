---
name: CI
on:
  # Run CI on push for 'master' branch and tags.
  push:
    branches: [main]
    tags: ["**"]
  # Run CI on pull request for all branches.
  pull_request:
    branches: ["**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Install dependencies
        run: |
          sudo -n apt-get -qq update
          sudo -n apt-get -qq install -y nasm
          npm install -g wasm-pack typedoc typescript
      - name: Install NodeJS
        uses: actions/setup-node@v4
      - run: node --version
      - name: Run tests
        run: ./ci/test.sh
  bench:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Enable unprivileged userfaultfd
        run: echo 1 | sudo tee /proc/sys/vm/unprivileged_userfaultfd
      - name: Enable unprivileged user namespaces
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Install Rust toolchain
        run: rustup default 1.91.0-x86_64-unknown-linux-gnu
      - name: Run benchmarks (PolkaVM)
        run: ./ci/bench.sh
